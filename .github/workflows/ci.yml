name: Agentic CRM - CI Pipeline

# 1. TRIGGER: Run on every push or pull request to main/master branch
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # -------------------------------------------------------------------------
  # JOB 1: Test & Lint Backend (Python / FastAPI)
  # -------------------------------------------------------------------------
  backend-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download repository code onto the GitHub runner machine
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Set up Python 3.11 environment
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Step 3: Install all backend dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # Step 4: Run automated tests
      - name: Run Backend Tests
        run: |
          python -m pytest backend/tests -v

  # -------------------------------------------------------------------------
  # JOB 2: Build & Validate Frontend (React / Vite)
  # -------------------------------------------------------------------------
  frontend-build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download code
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js 20 environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      # Step 3: Install NPM packages
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      # Step 4: Verify React builds cleanly with no compilation errors
      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build
